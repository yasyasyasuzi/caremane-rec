<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ケアマネREC｜介護支援専門員 音声記録</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

:root {
  --bg: #faf7f4;
  --card: #ffffff;
  --border: #e8ddd4;
  --text: #2d2420;
  --text-muted: #7a6560;
  --text-faint: #b5a89e;
  --primary: #c17a4a;
  --primary-light: #f5ede4;
  --accent: #a05c3a;
  --accent-light: #fdf0e8;
  --danger: #ef4444;
  --radius: 1rem;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
}

body {
  font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 120px;
}

/* HEADER */
header {
  position: sticky; top: 0; z-index: 40;
  background: rgba(250,247,244,0.88);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid #e8ddd4;
  padding: 14px 20px;
}
.logo-img { height: 44px; width: auto; object-fit: contain; }

/* MAIN */
main { padding: 16px; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

/* CARD */
.card {
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  overflow: hidden;
  box-shadow: var(--shadow);
}

/* BAND HEADER */
.band {
  padding: 10px 16px;
  display: flex; align-items: center; gap: 8px;
}
.band-rec {
  background: linear-gradient(90deg, rgba(193,122,74,0.15), rgba(160,92,58,0.06));
  border-bottom: 1px solid rgba(193,122,74,0.2);
}
.band-ai {
  background: linear-gradient(90deg, #a05c3a, #c17a4a);
  border-bottom: 1px solid rgba(139,92,246,0.4);
  justify-content: space-between;
}
.band-dot-rec {
  width: 7px; height: 7px; border-radius: 50%;
  background: #c17a4a;
}
.band-dot-rec.recording { background: var(--danger); animation: blink 1s infinite; }
.band-text-rec { font-size: 14px; font-weight: 700; color: #8a5535; }
.rec-live { margin-left: auto; display:none; align-items: center; gap: 4px; color: var(--danger); font-size: 12px; font-weight: 700; }
.rec-live.show { display: flex; }
.band-text-ai { font-size: 14px; font-weight: 700; color: white; display: flex; align-items: center; gap: 6px; }
.claude-pill {
  background: rgba(255,255,255,0.25); backdrop-filter: blur(4px);
  border: 1px solid rgba(255,255,255,0.4);
  padding: 2px 10px; border-radius: 100px;
  font-size: 11px; font-weight: 700; color: white;
}

/* RECORDING INDICATOR */
.recording-status {
  display: none;
  align-items: center; gap: 8px;
  background: rgba(239,68,68,0.08);
  border: 1px solid rgba(239,68,68,0.2);
  border-radius: 10px;
  padding: 8px 14px;
  margin-bottom: 10px;
  font-size: 14px; font-weight: 600; color: var(--danger);
}
.recording-status.show { display: flex; }
.recording-status-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--danger);
  animation: blink 1s infinite;
  flex-shrink: 0;
}
.recording-status-timer {
  margin-left: auto;
  font-size: 13px; font-variant-numeric: tabular-nums;
  color: var(--danger); font-weight: 700;
}

/* TEXTAREA */
.card-body { padding: 14px; }
.textarea {
  width: 100%; min-height: 150px;
  background: transparent; border: none; outline: none;
  font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif;
  font-size: 18px; line-height: 1.85; color: var(--text);
  resize: none;
}
.textarea::placeholder { color: var(--text-faint); font-size: 16px; }
.char-row {
  display: flex; justify-content: flex-end;
  border-top: 1px solid var(--border);
  padding-top: 8px; margin-top: 8px;
}
.char-count { font-size: 12px; color: var(--text-faint); }

/* TRANSCRIBE LOADING */
.transcribe-loading {
  display: none; align-items: center; gap: 8px;
  color: var(--accent); font-size: 14px; padding: 8px 0;
}
.transcribe-loading.show { display: flex; }

/* FORMAT TOGGLE */
.format-row { display: flex; gap: 8px; margin-bottom: 14px; }
.fmt-btn {
  flex: 1; padding: 10px 8px;
  border-radius: 0.75rem;
  border: 2.5px solid var(--border);
  background: #faf7f4;
  color: var(--text-muted);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.fmt-btn.active {
  background: #fdf0e8;
  border-color: #c17a4a;
  color: #c17a4a;
}

/* AI SPINNER */
.ai-spinner { display: none; align-items: center; gap: 8px; color: var(--primary); font-size: 14px; margin-bottom: 10px; }
.ai-spinner.show { display: flex; }
.spinner {
  width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid currentColor; border-top-color: transparent;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* AI OUTPUT */
.ai-output {
  width: 100%; min-height: 240px;
  background: #faf7f4;
  border: 1px solid var(--border);
  border-radius: 0.75rem;
  padding: 14px;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 18px; line-height: 1.85; color: var(--text);
  resize: vertical; outline: none;
  margin-bottom: 14px;
}
.ai-output::placeholder { color: var(--text-faint); font-size: 15px; }

/* BUTTONS */
.btn-ai-run {
  width: 100%; padding: 16px;
  background: linear-gradient(135deg, #c17a4a, #a05c3a);
  color: white; border: none;
  border-radius: var(--radius);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 16px; font-weight: 700;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: all 0.2s;
  box-shadow: 0 4px 20px rgba(193,122,74,0.35);
  margin-bottom: 10px;
}
.btn-ai-run:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-ai-run:not(:disabled):active { transform: scale(0.98); }

.btn-row { display: flex; gap: 10px; }
.btn-copy {
  flex: 1; padding: 13px 8px;
  border-radius: 0.75rem;
  border: 2px solid rgba(193,122,74,0.3);
  background: oklch(0.95 0.03 310);
  color: var(--primary);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all 0.18s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-clear {
  flex: 1; padding: 13px 8px;
  border-radius: 0.75rem;
  border: 2px solid var(--border);
  background: white;
  color: var(--text-muted);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all 0.18s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-copy:active, .btn-clear:active { transform: scale(0.97); }

/* FLOATING BUTTON */
.float-mic {
  position: fixed; bottom: 24px;
  left: 50%; transform: translateX(-50%);
  z-index: 50;
}

.mic-btn {
  position: relative;
  width: 80px; height: 80px; border-radius: 50%;
  border: none; cursor: pointer;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 11px; font-weight: 700; letter-spacing: 1px;
  transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
  background: linear-gradient(135deg, #c17a4a, #a05c3a);
  color: white;
  box-shadow: 0 20px 40px rgba(193,122,74,0.35);
}
.mic-btn::after {
  content: '';
  position: absolute; inset: -6px;
  border-radius: 50%;
  border: 2px solid rgba(193,122,74,0.3);
  pointer-events: none;
}
.mic-btn:hover { transform: scale(1.05); }
.mic-btn:active { transform: scale(0.95); }
.mic-btn.recording {
  background: var(--danger);
  box-shadow: 0 20px 40px rgba(239,68,68,0.4);
  transform: scale(1.1);
}
.mic-btn.recording::after { border-color: rgba(239,68,68,0.5); }
.mic-btn.recording:active { transform: scale(1.0); }

/* 波紋アニメーション */
.mic-pulse1, .mic-pulse2 {
  display: none;
  position: absolute; inset: 0; border-radius: 50%;
}
.mic-btn.recording .mic-pulse1 {
  display: block;
  background: var(--danger);
  animation: ping 1.2s cubic-bezier(0,0,0.2,1) infinite;
  opacity: 0.3;
}
.mic-btn.recording .mic-pulse2 {
  display: block;
  background: rgba(239,68,68,0.2);
  animation: pulse-slow 1.5s ease-in-out infinite;
}
@keyframes ping {
  75%, 100% { transform: scale(1.8); opacity: 0; }
}
@keyframes pulse-slow {
  0%, 100% { opacity: 0.2; } 50% { opacity: 0.4; }
}

.mic-timer {
  position: absolute; top: -28px; left: 50%; transform: translateX(-50%);
  font-size: 12px; font-weight: 600;
  color: var(--text-muted); font-variant-numeric: tabular-nums;
  white-space: nowrap;
  opacity: 0; transition: opacity 0.3s;
}
.mic-timer.visible { opacity: 1; }

/* TOAST */
.toast {
  position: fixed; bottom: 130px; left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: oklch(0.2 0.02 300); color: white;
  padding: 10px 22px; border-radius: 100px;
  font-size: 13px; font-weight: 500;
  opacity: 0; transition: all 0.25s;
  pointer-events: none; z-index: 300;
  white-space: nowrap;
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:10px;">
    <div style="width:44px;height:44px;background:linear-gradient(135deg,#c17a4a,#a05c3a);border-radius:12px;display:flex;align-items:center;justify-content:center;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
        <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div>
      <div style="font-size:20px;font-weight:800;color:#c17a4a;letter-spacing:-0.02em;font-family:sans-serif;">ケアマネREC</div>
      <div style="font-size:11px;color:#b5a89e;letter-spacing:0.06em;">介護支援専門員 音声記録</div>
    </div>
  </div>
</header>

<main>
  <!-- 録音テキスト -->
  <div class="card">
    <div class="band band-rec">
      <div class="band-dot-rec" id="bandDot"></div>
      <span class="band-text-rec">録音テキスト（編集可）</span>
      <div class="rec-live" id="recLive">
        <span>●</span><span>録音中</span>
      </div>
    </div>
    <div class="card-body">
      <div class="recording-status" id="recordingStatus">
        <div class="recording-status-dot"></div>
        <span>録音中… 話してください</span>
        <span class="recording-status-timer" id="statusTimer">0:00</span>
      </div>
      <div class="transcribe-loading" id="transcribeLoading">
        <div class="spinner" style="color:var(--accent)"></div>
        <span>文字起こし中…</span>
      </div>
      <textarea class="textarea" id="transcriptArea"
        placeholder="STARTをタップして話してください。&#10;面談内容・調整経過・モニタリング内容など&#10;STOPで録音終了 → 自動で文字起こしされます。"></textarea>
      <div class="char-row">
        <span class="char-count" id="charCount">0文字</span>
      </div>
    </div>
  </div>

  <!-- AI清書 -->
  <div class="card">
    <div class="band band-ai">
      <div class="band-text-ai">✦ AI 清書</div>
      <div class="claude-pill">Claude</div>
    </div>
    <div class="card-body">
      <div class="format-row">
        <button class="fmt-btn active" id="fmtProse" onclick="setFormat('prose')">📝 通常文章</button>
        <button class="fmt-btn" id="fmtBullet" onclick="setFormat('bullet')">📋 整理形式</button>
      </div>
      <div class="ai-spinner" id="aiSpinner">
        <div class="spinner"></div>
        <span>AI清書中…</span>
      </div>
      <textarea class="ai-output" id="aiOutput"
        placeholder="「AI清書する」ボタンを押すと報告書文体に整形します。"></textarea>
      <button class="btn-ai-run" id="aiBtn" onclick="runAI()" disabled>✦ AI清書する</button>
      <div class="btn-row">
        <button class="btn-copy" onclick="copyText()">✦ AI清書をコピー</button>
        <button class="btn-clear" onclick="clearAll()">🗑️ クリア</button>
      </div>
    </div>
  </div>
</main>

<!-- フローティングボタン -->
<div class="float-mic">
  <button class="mic-btn" id="micBtn" onclick="toggleRecording()">
    <div class="mic-pulse1"></div>
    <div class="mic-pulse2"></div>
    <span style="position:relative;z-index:10;font-size:14px;font-weight:700;letter-spacing:2px;" id="micLabel">START</span>
    <div class="mic-timer" id="micTimer">0:00</div>
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
// ── 状態 ──
let isRecording = false;
let timerInterval = null;
let seconds = 0;
let accumulated = '';
let outputFormat = 'prose';
let mediaRecorder = null;
let audioChunks = [];
let recognition = null;
let accumulated_before_stop = '';

// ── フォーマット ──
function setFormat(fmt) {
  outputFormat = fmt;
  document.getElementById('fmtProse').classList.toggle('active', fmt === 'prose');
  document.getElementById('fmtBullet').classList.toggle('active', fmt === 'bullet');
  const hasTranscript = document.getElementById('transcriptArea').value.trim();
  const hasAiOutput = document.getElementById('aiOutput').value.trim();
  if (hasTranscript && hasAiOutput) runAI();
}

// ── 専門用語辞書 ──
const CORRECTIONS = {
  'えすぴーおーつー':'SpO2','けつあつ':'血圧','みゃくはく':'脈拍','たいおん':'体温',
  'こきゅうすう':'呼吸数','じぇーしーえす':'JCS','じーしーえす':'GCS',
  'にんちしょう':'認知症','びーぴーえすでぃ':'BPSD','せんもう':'せん妄',
  'じょくそう':'褥瘡','はっせき':'発赤','ふしゅ':'浮腫','むくみ':'浮腫',
  'えんげしょうがい':'嚥下障害','ごえん':'誤嚥','ごえんせいはいえん':'誤嚥性肺炎',
  'きゅういん':'吸引','かくたん':'喀痰','こうくうケア':'口腔ケア',
  'ざいたくさんそ':'在宅酸素','ほっぷ':'HOT','じんこうこきゅうき':'人工呼吸器',
  'びーぱっぷ':'BIPAP','しーぱっぷ':'CPAP','けいかんえいよう':'経管栄養',
  'ぺぐ':'PEG','いろう':'胃ろう','ばるーんかてーてる':'バルーンカテーテル',
  'にょうろかんせん':'尿路感染','とうせき':'透析','かんわけあ':'緩和ケア',
  'たーみなるけあ':'ターミナルケア','でぃーえぬあーる':'DNR',
  'けあまねじゃー':'ケアマネジャー','たしょくしゅれんけい':'多職種連携',
  'ほうもんしんりょう':'訪問診療','おんこーる':'オンコール',
  'かんせつかどういき':'関節可動域','えむえむてぃ':'MMT','ろむ':'ROM',
  'はいようしょうこうぐん':'廃用症候群','こうしゅく':'拘縮',
  'えーでぃーえる':'ADL','あいえーでぃーえる':'IADL','ふぃむ':'FIM',
  'ぎょうがい':'仰臥位','そくがい':'側臥位','ふくがい':'腹臥位','たんざい':'端座位',
  'ふくやくかんり':'服薬管理','ぽりふぁーましー':'ポリファーマシー',
  'もるひね':'モルヒネ','おぴおいど':'オピオイド','おきしこどん':'オキシコドン',
  'ふぇんたにる':'フェンタニル','ぷれがばりん':'プレガバリン','りりかー':'リリカ',
  'かろなーる':'カロナール','ろきそにん':'ロキソニン','あすぴりん':'アスピリン',
  'わーふぁりん':'ワーファリン','らしっくす':'ラシックス','まぐみっと':'マグミット',
  'らんそぷらぞーる':'ランソプラゾール','たけぷろん':'タケプロン',
  'どねぺじる':'ドネペジル','ありせぷと':'アリセプト','めまんちん':'メマンチン',
  'めまりー':'メマリー','りすぺりどん':'リスペリドン','りすぱだーる':'リスパダール',
  'はるしおん':'ハルシオン','べるそむら':'ベルソムラ','でえびごー':'デエビゴ',
  'すとーま':'ストーマ','じんこうこうもん':'人工肛門',
  'そうしょしょち':'創傷処置','がーぜこうかん':'ガーゼ交換',
  'でざいんあーる':'DESIGN-R','でぶりーどまん':'デブリードマン',
};
function applyCorrections(text) {
  let r = text;
  for (const [k,v] of Object.entries(CORRECTIONS)) r = r.replace(new RegExp(k,'g'),v);
  return r;
}

// ── ビープ音 ──
function playBeep(type) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.value = type === 'start' ? 660 : 440;
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
    osc.start(); osc.stop(ctx.currentTime + 0.1);
  } catch(e) {}
}

// ── 振動 ──
function vibrate() { if (navigator.vibrate) navigator.vibrate(60); }

// ── Web Speech API リアルタイム ──
function startRealtime() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  const rt = new SR();
  rt.lang = 'ja-JP'; rt.continuous = true; rt.interimResults = true;
  rt.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) accumulated += applyCorrections(e.results[i][0].transcript);
      else interim += e.results[i][0].transcript;
    }
    const area = document.getElementById('transcriptArea');
    area.value = accumulated + interim;
    area.scrollTop = area.scrollHeight;
    updateCharCount(); updateAiBtn();
  };
  rt.onerror = e => { if (e.error === 'no-speech' || e.error === 'aborted') return; };
  rt.onend = () => { if (isRecording) try { rt.start(); } catch(e) {} };
  try { rt.start(); recognition = rt; } catch(e) {}
}

function stopRealtime() {
  if (recognition) { try { recognition.stop(); } catch(e) {} recognition = null; }
}

// ── 録音 ──
function toggleRecording() {
  vibrate();
  if (isRecording) stopRecording(); else startRecording();
}

function startRecording() {
  navigator.mediaDevices.getUserMedia({ audio: true })
    .then(stream => {
      audioChunks = [];
      const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
      mediaRecorder = new MediaRecorder(stream, { mimeType });
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        await sendToWhisper(new Blob(audioChunks, { type: mimeType }), mimeType);
      };
      mediaRecorder.start(1000);
      isRecording = true; seconds = 0;
      timerInterval = setInterval(() => {
        seconds++;
        const m = Math.floor(seconds/60), s = seconds%60;
        const timeStr = m+':'+String(s).padStart(2,'0');
        document.getElementById('micTimer').textContent = timeStr;
        const st = document.getElementById('statusTimer');
        if (st) st.textContent = timeStr;
      }, 1000);
      playBeep('start');
      document.getElementById('transcriptArea').scrollIntoView({ behavior: 'smooth', block: 'center' });
      setUI(true);
      setTimeout(() => { if (isRecording) startRealtime(); }, 300);
    })
    .catch(() => showToast('マイクの許可が必要です'));
}

function stopRecording() {
  accumulated_before_stop = accumulated;
  isRecording = false; clearInterval(timerInterval);
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  stopRealtime();
  playBeep('stop');
  setUI(false);
}

async function sendToWhisper(blob, mimeType) {
  document.getElementById('transcribeLoading').classList.add('show');
  try {
    const fd = new FormData();
    fd.append('audio', blob, mimeType.includes('mp4') ? 'audio.mp4' : 'audio.webm');
    const res = await fetch('/api/transcribe', { method:'POST', body:fd });
    const data = await res.json();
    if (data.text && data.text.trim()) {
      accumulated = accumulated_before_stop + applyCorrections(data.text);
      document.getElementById('transcriptArea').value = accumulated;
      document.getElementById('transcriptArea').scrollTop = 999999;
      updateCharCount(); updateAiBtn();
    }
  } catch(e) {}
  document.getElementById('transcribeLoading').classList.remove('show');
}

// ── UI ──
function setUI(rec) {
  const btn = document.getElementById('micBtn');
  const label = document.getElementById('micLabel');
  const timer = document.getElementById('micTimer');
  const statusTimer = document.getElementById('statusTimer');
  const bandDot = document.getElementById('bandDot');
  const recLive = document.getElementById('recLive');
  const recordingStatus = document.getElementById('recordingStatus');
  if (rec) {
    btn.classList.add('recording');
    label.textContent = 'STOP';
    timer.classList.add('visible');
    bandDot.classList.add('recording');
    recLive.classList.add('show');
    recordingStatus.classList.add('show');
  } else {
    btn.classList.remove('recording');
    label.textContent = 'START';
    timer.classList.remove('visible');
    timer.textContent = '0:00';
    bandDot.classList.remove('recording');
    recLive.classList.remove('show');
    recordingStatus.classList.remove('show');
    if (statusTimer) statusTimer.textContent = '0:00';
  }
}

function updateCharCount() {
  document.getElementById('charCount').textContent = document.getElementById('transcriptArea').value.length + '文字';
}
function updateAiBtn() {
  document.getElementById('aiBtn').disabled = !document.getElementById('transcriptArea').value.trim();
}
document.getElementById('transcriptArea').addEventListener('input', () => {
  accumulated = document.getElementById('transcriptArea').value;
  updateCharCount(); updateAiBtn();
});

// ── AI清書 ──
function buildPrompt(t) {
  if (outputFormat === 'prose') {
    return `あなたは介護支援専門員（ケアマネジャー）の記録をサポートするAIです。以下の音声入力テキストを支援経過記録またはモニタリング記録として清書してください。
【ルール】
- 介護保険・ケアマネジメントの現場に即した専門的な記録文体で書く
- 人名（利用者・家族・事業所担当者の名前）は「●●様」「●●さん」に置き換える。ただし「ご様子」「お様子」「様式」「様相」「家族」「家庭」など一般的な言葉は置き換えない
- 【】などの見出しは一切使わず、面談内容・調整経過・今後の方針などを自然な文章の流れでひとつながりに記述する
- 丁寧な会話調（〜しました。〜でした。〜ありました。〜確認しました。〜調整しました。）で記述する
- 箇条書きは絶対に使わない
- Markdown記法（**、##、*など）は絶対に使わない
- 不明確な部分は「（要確認）」と記載

【音声入力】
${t}

【清書後の記録文】`;
  } else {
    return `あなたは介護支援専門員（ケアマネジャー）の記録をサポートするAIです。以下の音声入力テキストを支援経過記録またはモニタリング記録として清書してください。
【ルール】
- 介護保険・ケアマネジメントの現場に即した専門的な記録文体で書く
- 人名（利用者・家族・事業所担当者の名前）は「●●様」「●●さん」に置き換える。ただし「ご様子」「お様子」「様式」「様相」「家族」「家庭」など一般的な言葉は置き換えない
- 丁寧な会話調（〜しました。〜でした。〜ありました。〜確認しました。〜調整しました。）で記述する
- 生活状況・心身状態・サービス利用状況・家族状況・連絡調整内容・今後の方針など、情報がある項目のみ【　】の見出しをつけて整理する
- 各項目の内容は箇条書き（・）で簡潔に記述する
- Markdown記法（**、##、*など）は絶対に使わない
- 不明確な部分は「（要確認）」と記載

【音声入力】
${t}

【清書後の記録文】`;
  }
}

async function runAI() {
  const text = document.getElementById('transcriptArea').value.trim();
  if (!text) return;
  const spinner = document.getElementById('aiSpinner');
  const output = document.getElementById('aiOutput');
  const btn = document.getElementById('aiBtn');
  spinner.classList.add('show'); output.value = ''; btn.disabled = true;
  try {
    const res = await fetch('/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ prompt: buildPrompt(text), role: 'nurse' })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    output.value = (data.text || '').replace(/\*\*/g,'').replace(/#{1,6} /g,'').replace(/\*/g,'');
    showToast('AI清書が完了しました！');
  } catch(e) {
    output.placeholder = 'エラーが発生しました。';
    showToast('AI清書に失敗しました');
  } finally {
    spinner.classList.remove('show'); btn.disabled = false; updateAiBtn();
  }
}

// ── コピー・クリア ──
async function copyText() {
  const text = document.getElementById('aiOutput').value;
  if (!text.trim()) { showToast('コピーするテキストがありません'); return; }
  try {
    await navigator.clipboard.writeText(text);
    showToast('AI清書をコピーしました');
  } catch { showToast('コピーに失敗しました'); }
}

function clearAll() {
  const t = document.getElementById('transcriptArea').value;
  const a = document.getElementById('aiOutput').value;
  if (!t && !a) return;
  if (!confirm('テキストをクリアしますか？')) return;
  accumulated = '';
  document.getElementById('transcriptArea').value = '';
  document.getElementById('aiOutput').value = '';
  updateCharCount(); updateAiBtn();
  showToast('クリアしました');
}

// ── Toast ──
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

updateCharCount(); updateAiBtn();
</script>
